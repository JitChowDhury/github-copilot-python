<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sudoku Game</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <main>
    <header class="page-header">
      <h1>Sudoku Game</h1>
      <button id="dark-mode-toggle" type="button" aria-pressed="false">Dark mode: Off</button>
    </header>
    <div class="game-settings">
      <label for="difficulty">Difficulty</label>
      <select id="difficulty" name="difficulty">
        <option value="Easy" selected>Easy</option>
        <option value="Medium">Medium</option>
        <option value="Hard">Hard</option>
      </select>
      <label for="player-name">Player name</label>
      <input id="player-name" name="player-name" type="text" maxlength="40" autocomplete="name">
    </div>
    <div id="sudoku-board" aria-label="Sudoku board"></div>
    <div class="controls">
      <button id="new-game" type="button">New Game</button>
      <button id="check-solution" type="button">Check Solution</button>
      <button id="hint" type="button">Hint</button>
      <span id="timer-label">Time: <span id="timer">00:00</span></span>
      <span id="hint-count">Hints used: 0</span>
      <span id="message" role="status" aria-live="polite"></span>
    </div>
    <section id="leaderboard" aria-labelledby="leaderboard-heading">
      <h2 id="leaderboard-heading">Top 10 Leaderboard</h2>
      <div class="leaderboard-scroll">
        <table>
          <caption>Fastest completed Sudoku games</caption>
          <thead>
            <tr>
              <th scope="col">Rank</th>
              <th scope="col">Player</th>
              <th scope="col">Time</th>
              <th scope="col">Difficulty</th>
              <th scope="col">Hints</th>
            </tr>
          </thead>
          <tbody id="leaderboard-body"></tbody>
        </table>
      </div>
    </section>
  </main>
  <script src="/static/main.js"></script>
</body>
</html>
